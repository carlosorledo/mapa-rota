<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PROSPECT — Validação de Base</title>
<style>
:root{
  --azul:#1f2f8f;--azul2:#3b5bdb;--ciano:#17b3c4;--bg:#f3f4f7;--card:#fff;
  --txt:#111827;--muted:#6b7280;--borda:#e5e7eb;--verde:#059669;--verdebg:#d1fae5;
  --vermelho:#dc2626;--vermelhobg:#fee2e2;--amarelo:#b45309;--amarelobg:#fef3c7;
  --cinza:#64748b;--cinzabg:#e2e8f0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
button,input,select{font:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:540px;margin:0 auto;background:var(--bg);box-shadow:0 0 26px rgba(0,0,0,.08)}
#topo{flex:0 0 auto;padding:11px 14px;background:#fff;border-bottom:1px solid var(--borda);z-index:20}
.topline{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(145deg,var(--azul),var(--azul2));display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;box-shadow:0 4px 12px rgba(59,91,219,.25)}
#topo b{font-size:14px;display:block}
#topo small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
#corpo{position:relative;flex:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;background:#e8eaed;touch-action:none;cursor:grab;user-select:none}
#map.arrastando{cursor:grabbing}
#tiles,#marcas{position:absolute;inset:0;width:100%;height:100%}
#marcas{pointer-events:none}
#tiles img{position:absolute;width:256px;height:256px;pointer-events:none}
.mk{position:absolute;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.38);pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%)}
.mk.on{border-width:3px;z-index:5}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:5px;z-index:10}
#zoom button{width:36px;height:36px;border-radius:10px;border:1px solid #cbd0d6;background:#fff;font-size:20px;font-weight:800;color:#374151;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.18)}
#credito{position:absolute;left:0;bottom:0;background:rgba(255,255,255,.78);font-size:9px;color:#444;padding:1px 5px;z-index:10}
#painel{position:absolute;left:0;right:0;bottom:0;z-index:11;height:var(--painel-h,56%);max-height:calc(100% - 46px);min-height:160px;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 26px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;transition:height .28s cubic-bezier(.22,.61,.36,1)}
#painel.arrastando{transition:none}
.painel-fixo{flex:0 0 auto;background:var(--bg);padding:0 12px 0;box-shadow:0 7px 10px -9px rgba(0,0,0,.18);z-index:4}
.puxador-area{padding:9px 0 10px;cursor:grab;touch-action:none}
.puxador{width:44px;height:5px;background:#cbd5e1;border-radius:99px;margin:auto}
#lista{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 30px}
.busca{position:relative;margin-bottom:9px}
.busca input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--borda);border-radius:13px;font-size:15px;background:#fff;outline:none}
.busca input:focus,.filtros select:focus{border-color:var(--azul2);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.48}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.filtros select{width:100%;min-width:0;padding:10px 9px;border:1px solid var(--borda);border-radius:10px;background:#fff;font-size:12.5px;font-weight:650;color:#374151;outline:none}
.filtros .wide{grid-column:1/-1}
.resumo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 3px 9px;color:var(--muted);font-size:11.5px}
.legend{display:flex;gap:7px;align-items:center;white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:3px}
.ldot{width:7px;height:7px;border-radius:50%;display:inline-block}
.card{background:var(--card);border:1px solid var(--borda);border-radius:15px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.055);cursor:pointer}
.card.sel{border-color:var(--azul2);box-shadow:0 0 0 3px rgba(59,91,219,.14)}
.card-top{display:flex;align-items:flex-start;gap:9px}
.tipo-ico{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;background:#eef2ff;font-size:16px}
.nomebox{flex:1;min-width:0}
.nome{font-weight:800;font-size:14px;line-height:1.24;text-transform:none}
.categoria{font-size:11px;color:var(--muted);margin-top:2px}
.status-pill{flex:0 0 auto;font-size:10px;font-weight:800;border-radius:99px;padding:5px 8px;white-space:nowrap}
.status-pill.open{color:var(--verde);background:var(--verdebg)}
.status-pill.closed{color:var(--vermelho);background:var(--vermelhobg)}
.status-pill.unknown{color:var(--cinza);background:var(--cinzabg)}
.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:#475569;margin-top:8px}
.star{color:#f59e0b;font-weight:800}
.hoje{margin-top:7px;padding:8px 9px;border-radius:10px;background:#f8fafc;border:1px solid #edf0f4;font-size:11.5px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hoje b{font-size:11.5px}
.transicao{color:var(--azul2);font-weight:750;text-align:right}
.end{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:10.5px;padding:4px 7px;border-radius:99px;background:#f1f5f9;color:#475569;font-weight:650}
.tag.good{background:#ecfdf5;color:#047857}
.det{margin-top:11px;border-top:1px dashed var(--borda);padding-top:8px}
.linha{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:4px 0;align-items:flex-start}
.linha b{color:#374151;font-weight:650}
.linha span{color:var(--muted);text-align:right;max-width:65%;word-break:break-word}
.week{margin-top:8px;background:#f8fafc;border:1px solid #edf0f4;border-radius:11px;padding:8px}
.week-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.45px;font-weight:800;margin-bottom:4px}
.week-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0}
.week-row.today{font-weight:800;color:var(--azul2)}
.week-row span:last-child{text-align:right}
.botoes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:10px;border:none;font-size:12.5px;font-weight:800;text-decoration:none;cursor:pointer}
.btn-primary{background:var(--azul2);color:#fff}
.btn-soft{background:#eef2ff;color:var(--azul)}
.btn-phone{background:#ecfdf5;color:#047857}
.btn-site{background:#f1f5f9;color:#334155}
.btn.disabled{opacity:.45;pointer-events:none}
.vazio{text-align:center;color:var(--muted);font-size:13px;padding:32px 10px}
.empty-data{padding:24px 16px;text-align:center;color:var(--muted)}
.empty-data b{display:block;color:var(--txt);margin-bottom:5px}
@media(max-width:360px){
  .filtros{grid-template-columns:1fr}
  .filtros .wide{grid-column:auto}
  .legend{display:none}
}
@media(min-width:900px){
  html,body{background:#e5e7eb}
  #app{display:grid;max-width:none;height:100vh;box-shadow:none;grid-template-columns:470px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"topo topo" "painel map"}
  #topo{grid-area:topo;padding:13px 22px}
  #topo b{font-size:16px}
  #topo small{font-size:12px}
  #corpo{display:contents}
  #map{grid-area:map;position:static;height:100%;min-height:0}
  #painel{grid-area:painel;position:static;height:100%;max-height:none;min-height:0;border-radius:0;box-shadow:2px 0 15px rgba(0,0,0,.06);border-right:1px solid var(--borda);transition:none}
  .puxador-area{display:none}
  .painel-fixo{padding:14px 18px 0}
  #lista{padding:0 18px 30px}
  .card{transition:.15s border-color,.15s box-shadow}
  .card:hover{border-color:#bcc8ff;box-shadow:0 4px 14px rgba(59,91,219,.12)}
  #zoom{right:20px;bottom:20px}
}
@media(min-width:1300px){#app{grid-template-columns:500px 1fr}}
</style>

<style>

/* ==========================================================
   LOCALIZAÇÃO DO USUÁRIO
   ========================================================== */

.user-location {
    position: absolute;
    width: 19px;
    height: 19px;
    background: #4285F4;
    border: 3px solid white;
    border-radius: 50%;
    box-shadow:
        0 0 0 2px rgba(66,133,244,.20),
        0 2px 8px rgba(0,0,0,.35);
    transform: translate(-50%, -50%);
    z-index: 1002;
    pointer-events: none;
}

.user-location::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 32px;
    height: 32px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(66,133,244,.20);
    animation: gpsPulse 1.8s infinite;
    z-index: -1;
}

@keyframes gpsPulse {

    0% {
        transform:
            translate(-50%, -50%)
            scale(.55);

        opacity: .9;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1.8);

        opacity: 0;
    }
}


/* círculo de precisão */

.user-accuracy {
    position: absolute;

    border-radius: 50%;

    background:
        rgba(66,133,244,.10);

    border:
        1px solid
        rgba(66,133,244,.22);

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    z-index: 999;
}


/* ==========================================================
   BOTÃO MINHA LOCALIZAÇÃO
   ========================================================== */

#btnMinhaLocalizacao {

    position: absolute;

    right: 10px;

    bottom: 94px;

    width: 44px;

    height: 44px;

    border-radius: 13px;

    border:
        1px solid #d1d5db;

    background: white;

    z-index: 25;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.20);

    cursor: pointer;

    display: grid;

    place-items: center;

    font-size: 22px;

    font-weight: 900;

    color: #475569;
}


#btnMinhaLocalizacao.ativo {

    color: #4285F4;

    border-color: #4285F4;

}


/* ==========================================================
   BOTÃO MOSTRAR TODOS
   ========================================================== */

#btnMostrarTodos {

    display: none;

    width: 100%;

    border: none;

    background: #eef2ff;

    color: #1f2f8f;

    padding: 10px 12px;

    border-radius: 10px;

    font-size: 12px;

    font-weight: 800;

    margin-bottom: 8px;

    cursor: pointer;

}


#btnMostrarTodos.visible {

    display: block;

}


/* ==========================================================
   INDICADOR DE PDV SELECIONADO
   ========================================================== */

.selecionado-aviso {

    display: none;

    padding: 8px 10px;

    border-radius: 10px;

    background: #eff6ff;

    border: 1px solid #bfdbfe;

    color: #1e40af;

    font-size: 11px;

    margin-bottom: 7px;

}


.selecionado-aviso.visible {

    display: block;

}


/* ==========================================================
   MAPA
   ========================================================== */

#tiles {

    background: #e5e7eb;

}

#tiles img {

    background: #e5e7eb;

}


@media (min-width: 900px) {

    #btnMinhaLocalizacao {

        right: 20px;

        bottom: 82px;

    }

}

</style>

</head>

  <header id="topo">

<div

<button

            <span><i class="ldot" style="background:#94a3b8"></i>sem horário</span>
          </div>
        </div>
      </div>
      <div id="lista"></div>
    </section>
  </main>
</div>

const TZ = "America/Sao_Paulo";
const TILE=256;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s==null?"":s).trim();
const bool=v=>v===true || v===1 || String(v).toLowerCase()==="true";
const DAY_EN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_PT={Sunday:"Domingo",Monday:"Segunda",Tuesday:"Terça",Wednesday:"Quarta",Thursday:"Quinta",Friday:"Sexta",Saturday:"Sábado"};

function nowParts(){
  try{
    const parts=new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"long",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
    const o={}; parts.forEach(p=>o[p.type]=p.value);
    let h=parseInt(o.hour||"0",10); if(h===24) h=0;
    return {day:o.weekday,hour:h,minute:parseInt(o.minute||"0",10)};
  }catch(e){
    const d=new Date(); return {day:DAY_EN[d.getDay()],hour:d.getHours(),minute:d.getMinutes()};
  }
}
function hour12toMin(txt, fallbackMeridiem){
  let s=norm(txt).replace(/\u202f|\u00a0/g," ");
  let m=s.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?/i);
  if(!m) return null;
  let h=parseInt(m[1],10), min=parseInt(m[2]||"0",10), mer=(m[3]||fallbackMeridiem||"").toUpperCase();
  if(mer==="AM"){ if(h===12) h=0; }
  else if(mer==="PM"){ if(h!==12) h+=12; }
  return h*60+min;
}
function fmtMin(m){
  m=((m%1440)+1440)%1440;
  const h=Math.floor(m/60), mm=m%60;
  return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}
function weekdayDescriptions(p){
  let h=p.regularOpeningHours_weekdayDescriptions;
  if(Array.isArray(h)) return h.map(String);
  h=norm(h);
  if(!h) return [];
  return h.split(/(?=(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday):)/g).map(s=>s.trim()).filter(Boolean);
}
function lineForDay(p, day){
  return weekdayDescriptions(p).find(x=>x.toLowerCase().startsWith(day.toLowerCase()+":")) || "";
}
function intervalsFromLine(line){
  if(!line) return null;
  let body=line.replace(/^[^:]+:\s*/,"").trim().replace(/\u202f|\u00a0/g," ");
  if(!body) return null;
  if(/closed/i.test(body)) return [];
  if(/open 24 hours/i.test(body)) return [[0,1440]];
  let chunks=body.split(/\s*,\s*/).filter(Boolean), out=[];
  chunks.forEach(ch=>{
    let mm=ch.match(/(.+?)\s*[–—-]\s*(.+)/);
    if(!mm) return;
    const sm=(mm[1].match(/\b(AM|PM)\b/i)||[])[1];
    const em=(mm[2].match(/\b(AM|PM)\b/i)||[])[1];
    let s=hour12toMin(mm[1],sm||em), e=hour12toMin(mm[2],em||sm);
    if(s==null||e==null) return;
    if(e<=s) e+=1440;
    out.push([s,e]);
  });
  return out.length?out:null;
}
function scheduleStatus(p){
  const n=nowParts(), now=n.hour*60+n.minute, dayIdx=DAY_EN.indexOf(n.day);
  const today=lineForDay(p,n.day), ints=intervalsFromLine(today);

  if(ints){
    for(const [s,e] of ints){
      let cur=now;
      if(cur>=s && cur<e) return {state:"open",label:"Aberto agora",today,transition:"Fecha às "+fmtMin(e)};
    }
  }

  // Confere se um intervalo de ontem atravessou a meia-noite.
  const prevDay=DAY_EN[(dayIdx+6)%7], prevInts=intervalsFromLine(lineForDay(p,prevDay));
  if(prevInts){
    for(const [s,e] of prevInts){
      if(e>1440 && now<(e-1440)) return {state:"open",label:"Aberto agora",today,transition:"Fecha às "+fmtMin(e)};
    }
  }

  if(ints){
    const fut=ints.find(x=>x[0]>now);
    if(fut) return {state:"closed",label:"Fechado agora",today,transition:"Abre hoje às "+fmtMin(fut[0])};
  }

  // Procura a próxima abertura nos dias seguintes.
  for(let off=1;off<=7;off++){
    const d=DAY_EN[(dayIdx+off)%7], a=intervalsFromLine(lineForDay(p,d));
    if(a && a.length){
      return {state:"closed",label:"Fechado agora",today,transition:"Abre "+DAY_PT[d].toLowerCase()+" às "+fmtMin(a[0][0])};
    }
  }

  if(today || weekdayDescriptions(p).length) return {state:"closed",label:"Fechado agora",today,transition:"Sem próxima abertura identificada"};
  return {state:"unknown",label:"Horário não informado",today:"",transition:""};
}
function prettyType(p){

  if(t.includes("snack")) return "🥪";

}

/* ----------------------- MAPA ----------------------- */
let mapEl=$("map"),tilesEl=$("tiles"),marcasEl=$("marcas"),zoom=12,cLat=-23.55,cLon=-46.82,cacheTiles={},_mapaAgendado=false;
function project(lat,lon,z){
  const s=TILE*Math.pow(2,z), x=(lon+180)/360*s, sin=Math.sin(lat*Math.PI/180);
  const y=(0.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*s; return{x,y};
}
function unproject(x,y,z){
  const s=TILE*Math.pow(2,z), lon=x/s*360-180, n=Math.PI-2*Math.PI*y/s;
  const lat=180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); return{lat,lon};
}
function painelOverlapPx(){return window.innerWidth<900?Math.max(0,$("painel").getBoundingClientRect().height-40):0}
function desenharMapa(){
  if(!mapEl.clientWidth||!mapEl.clientHeight)return;
  const W=mapEl.clientWidth,H=mapEl.clientHeight,n=Math.pow(2,zoom),c=project(cLat,cLon,zoom),ox=c.x-W/2,oy=c.y-H/2;
  const x0=Math.floor(ox/TILE),x1=Math.floor((ox+W)/TILE),y0=Math.floor(oy/TILE),y1=Math.floor((oy+H)/TILE),usados={};
  for(let tx=x0;tx<=x1;tx++)for(let ty=y0;ty<=y1;ty++){
    if(ty<0||ty>=n)continue;
    const wx=((tx%n)+n)%n,k=zoom+"_"+wx+"_"+ty+"_"+tx;usados[k]=1;let img=cacheTiles[k];
    if(!img){
      img=document.createElement("img");img.draggable=false;img.alt="";img.loading="eager";img.dataset.tent="0";
      ((im,X,Y,Z)=>{
        im.onerror=()=>{let t=parseInt(im.dataset.tent||"0",10)+1;im.dataset.tent=String(t);
          if(t===1)im.src="https://mt"+((X+Y+1)%4)+".google.com/vt/lyrs=m&hl=pt-BR&x="+X+"&y="+Y+"&z="+Z;
          else if(t===2)im.src="https://tile.openstreetmap.org/"+Z+"/"+X+"/"+Y+".png";
          else{im.onerror=null;im.style.background="#e8eaed"}};
        im.src="https://mt"+((X+Y)%4)+".google.com/vt/lyrs=m&hl=pt-BR&x="+X+"&y="+Y+"&z="+Z;
      })(img,wx,ty,zoom);
      cacheTiles[k]=img;tilesEl.appendChild(img);
    }
    img.style.left=(tx*TILE-ox)+"px";img.style.top=(ty*TILE-oy)+"px";
  }
  for(const k in cacheTiles)if(!usados[k]){tilesEl.removeChild(cacheTiles[k]);delete cacheTiles[k]}
  const frag=document.createDocumentFragment();
  FILTRADOS.forEach(p=>{
    const q=project(p.lat,p.lon,zoom),x=q.x-ox,y=q.y-oy;if(x<-40||y<-40||x>W+40||y>H+40)return;
    const active=SEL&&SEL.place_id_ambev===p.place_id_ambev,t=active?27:19,d=document.createElement("div"),st=scheduleStatus(p);
    d.className="mk"+(active?" on":"");d.style.cssText="left:"+x+"px;top:"+y+"px;width:"+t+"px;height:"+t+"px;background:"+statusColor(st.state);
    d.title=(p.name||"Estabelecimento")+" — "+st.label;d.onclick=ev=>{ev.stopPropagation();SEL=p;centralizar(p.lat,p.lon,Math.max(zoom,16));desenharLista()};
    frag.appendChild(d);
  });
  marcasEl.innerHTML="";marcasEl.appendChild(frag);
}
function agendarDesenho(){if(_mapaAgendado)return;_mapaAgendado=true;requestAnimationFrame(()=>{_mapaAgendado=false;desenharMapa()})}
function centralizar(lat,lon,z){cLat=lat;cLon=lon;if(z)zoom=Math.max(3,Math.min(19,z));desenharMapa()}
function enquadrar(pts){
  if(!pts.length){desenharMapa();return}
  if(pts.length===1){centralizar(pts[0].lat,pts[0].lon,16);return}
  let minLat=90,maxLat=-90,minLon=180,maxLon=-180;
  pts.forEach(p=>{minLat=Math.min(minLat,p.lat);maxLat=Math.max(maxLat,p.lat);minLon=Math.min(minLon,p.lon);maxLon=Math.max(maxLon,p.lon)});
  const W=Math.max(180,mapEl.clientWidth-60),H=Math.max(180,mapEl.clientHeight-painelOverlapPx()-60);let z;
  for(z=18;z>=3;z--){const a=project(minLat,minLon,z),b=project(maxLat,maxLon,z);if(Math.abs(b.x-a.x)<=W&&Math.abs(b.y-a.y)<=H)break}
  centralizar((minLat+maxLat)/2,(minLon+maxLon)/2,z);
}
(()=>{
  let arr=false,lx=0,ly=0,pinch=0;
  const pos=e=>e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};
  const dist=e=>{const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};
  const ini=e=>{if(e.touches&&e.touches.length===2){pinch=dist(e);arr=false;return}arr=true;const p=pos(e);lx=p.x;ly=p.y;mapEl.classList.add("arrastando")};
  const mov=e=>{if(e.touches&&e.touches.length===2&&pinch){e.preventDefault();const d=dist(e),r=d/pinch;if(r>1.5){zoom=Math.min(19,zoom+1);pinch=d;agendarDesenho()}else if(r<.66){zoom=Math.max(3,zoom-1);pinch=d;agendarDesenho()}return}
    if(!arr)return;e.preventDefault();const p=pos(e),dx=p.x-lx,dy=p.y-ly;lx=p.x;ly=p.y;const c=project(cLat,cLon,zoom),n=unproject(c.x-dx,c.y-dy,zoom);cLat=Math.max(-85,Math.min(85,n.lat));cLon=n.lon;agendarDesenho()};
  const fim=()=>{arr=false;pinch=0;mapEl.classList.remove("arrastando")};
  mapEl.addEventListener("mousedown",ini);window.addEventListener("mousemove",mov);window.addEventListener("mouseup",fim);
  mapEl.addEventListener("touchstart",ini,{passive:false});mapEl.addEventListener("touchmove",mov,{passive:false});mapEl.addEventListener("touchend",fim);
  mapEl.addEventListener("wheel",e=>{e.preventDefault();zoom=e.deltaY<0?Math.min(19,zoom+1):Math.max(3,zoom-1);agendarDesenho()},{passive:false});
  mapEl.addEventListener("dblclick",()=>{zoom=Math.min(19,zoom+1);desenharMapa()});
  $("zIn").onclick=()=>{zoom=Math.min(19,zoom+1);desenharMapa()};$("zOut").onclick=()=>{zoom=Math.max(3,zoom-1);desenharMapa()};
})();

/* ----------------------- GAVETA MOBILE ----------------------- */
(()=>{
  const corpo=$("corpo"),painel=$("painel"),pega=$("puxadorArea");if(!corpo||!painel||!pega)return;
  const EST=[.25,.48,.91];let estado=1,arr=false,startY=0,startH=0,moved=false;
  const desktop=()=>window.innerWidth>=900,altura=()=>corpo.clientHeight||1;
  const go=(i,anim=true)=>{estado=Math.max(0,Math.min(EST.length-1,i));painel.classList.toggle("arrastando",!anim);painel.style.height=(altura()*EST[estado])+"px"};
  const pos=e=>e.clientY!==undefined?e.clientY:(e.touches&&e.touches[0]?e.touches[0].clientY:0);
  const ini=e=>{if(desktop())return;arr=true;moved=false;startY=pos(e);startH=painel.getBoundingClientRect().height;painel.classList.add("arrastando")};
  const mov=e=>{if(!arr)return;e.preventDefault();const dy=startY-pos(e);if(Math.abs(dy)>6)moved=true;painel.style.height=Math.max(145,Math.min(altura()-46,startH+dy))+"px"};
  const fim=()=>{if(!arr)return;arr=false;if(!moved){go(estado===2?1:2,true);return}const f=painel.getBoundingClientRect().height/altura();let best=0,bd=99;EST.forEach((x,i)=>{const d=Math.abs(x-f);if(d<bd){bd=d;best=i}});go(best,true)};
  if(window.PointerEvent){pega.addEventListener("pointerdown",ini);pega.addEventListener("pointermove",mov);pega.addEventListener("pointerup",fim);pega.addEventListener("pointercancel",fim)}
  else{pega.addEventListener("touchstart",ini,{passive:true});pega.addEventListener("touchmove",mov,{passive:false});pega.addEventListener("touchend",fim)}
  window._updatePanel=()=>{if(!desktop())go(estado,false)};go(1,false);
})();

/* ----------------------- BOOT ----------------------- */
fillFilters();
["fCidade","fTipo","fAberto"].forEach(id=>$(id).addEventListener("change",()=>aplicarFiltros()));
let timer=null;$("q").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>aplicarFiltros(),180)});
if(PDVS.length){
  $("subtitulo").textContent=PDVS.length+" prospects • sem histórico de visitas • status de abertura calculado em horário de São Paulo";
  aplicarFiltros();
}else{
  $("contador").textContent="0 estabelecimentos";
  $("lista").innerHTML='<div class="empty-data"><b>Base não incorporada nesta prévia.</b>Use o gerador Databricks para embutir o df_filtrado completo.</div>';
  desenharMapa();
}
window.addEventListener("resize",()=>{agendarDesenho();if(window._updatePanel)window._updatePanel()});
setInterval(()=>{desenharLista();desenharMapa()},60000);
</script>

<script>

/* ==========================================================

let userLat = null;
let userLon = null;

let filtroProspectSelecionado = null;


/* ==========================================================

}

/* ==========================================================
   INTERCEPTAR CLIQUE NOS CARDS

/*
   O HTML original só "selecionava"
   o card.

   Aqui usamos captura para
   interceptar antes do listener
   original.
*/

document
    .getElementById("lista")
    .addEventListener(

        "click",

        function(ev) {

            /*

/* ==========================================================
   NOVO DESENHO DO MAPA
   OpenStreetMap primeiro
   Google apenas fallback
   ========================================================== */

function desenharMapaV2() {

    if (
        !mapEl ||
        !mapEl.clientWidth ||
        !mapEl.clientHeight
    ) {

        return;

    }


    const W =
        mapEl.clientWidth;

    const H =
        mapEl.clientHeight;


    const n =
        Math.pow(
            2,
            zoom
        );


    const centro =
        project(
            cLat,
            cLon,
            zoom
        );


    const ox =
        centro.x
        - W / 2;


    const oy =
        centro.y
        - H / 2;


    const x0 =
        Math.floor(
            ox / TILE
        );


    const x1 =
        Math.floor(
            (ox + W)
            / TILE
        );


    const y0 =
        Math.floor(
            oy / TILE
        );


    const y1 =
        Math.floor(
            (oy + H)
            / TILE
        );


    const usados = {};


    /*
       ======================================================
       TILES
       ======================================================
    */

    for (
        let tx = x0;
        tx <= x1;
        tx++
    ) {

        for (
            let ty = y0;
            ty <= y1;
            ty++
        ) {

            if (
                ty < 0 ||
                ty >= n
            ) {

                continue;

            }


            const wx =
                (
                    (tx % n)
                    + n
                )
                % n;


            const key =
                "osm_"
                + zoom
                + "_"
                + wx
                + "_"
                + ty
                + "_"
                + tx;


            usados[key] = 1;


            let img =
                cacheTiles[key];


            if (!img) {

                img =
                    document
                    .createElement(
                        "img"
                    );


                img.draggable =
                    false;


                img.alt = "";


                img.loading =
                    "eager";


                img.dataset.tent =
                    "0";


                /*
                   PRIMEIRO:
                   OpenStreetMap

                   FALLBACK:
                   Google tiles
                */

                img.onerror =
                    function() {

                        const tentativa =
                            Number(
                                img.dataset.tent
                                || 0
                            ) + 1;


                        img.dataset.tent =
                            String(
                                tentativa
                            );


                        if (
                            tentativa === 1
                        ) {

                            img.src =
                                "https://mt"
                                + (
                                    (
                                        wx
                                        + ty
                                    )
                                    % 4
                                )
                                + ".google.com/vt/lyrs=m"
                                + "&hl=pt-BR"
                                + "&x="
                                + wx
                                + "&y="
                                + ty
                                + "&z="
                                + zoom;

                        }

                        else {

                            img.onerror =
                                null;

                            img.style.background =
                                "#e5e7eb";

                        }

                    };


                img.src =
                    "https://tile.openstreetmap.org/"
                    + zoom
                    + "/"
                    + wx
                    + "/"
                    + ty
                    + ".png";


                cacheTiles[key] =
                    img;


                tilesEl.appendChild(
                    img
                );

            }


            img.style.left =
                (
                    tx * TILE
                    - ox
                )
                + "px";


            img.style.top =
                (
                    ty * TILE
                    - oy
                )
                + "px";

        }

    }


    /*
       remove tiles fora da tela
    */

    for (
        const key in cacheTiles
    ) {

        if (
            !usados[key]
        ) {

            try {

                tilesEl.removeChild(
                    cacheTiles[key]
                );

            }

            catch(e) {}


            delete cacheTiles[key];

        }

    }


    /*
       ======================================================
       MARCADORES
       ======================================================
    */

    const frag =
        document
        .createDocumentFragment();


    FILTRADOS.forEach(
        function(p) {

            const pos =
                project(
                    p.lat,
                    p.lon,
                    zoom
                );


            const x =
                pos.x
                - ox;


            const y =
                pos.y
                - oy;


            if (
                x < -50 ||
                y < -50 ||
                x > W + 50 ||
                y > H + 50
            ) {

                return;

            }


            const ativo =
                SEL &&
                SEL.place_id_ambev
                ===
                p.place_id_ambev;


            const tamanho =
                ativo
                ? 28
                : 20;


            const marker =
                document
                .createElement(
                    "div"
                );


            const status =
                scheduleStatus(
                    p
                );


            marker.className =
                "mk"
                + (
                    ativo
                    ? " on"
                    : ""
                );


            marker.style.left =
                x + "px";


            marker.style.top =
                y + "px";


            marker.style.width =
                tamanho
                + "px";


            marker.style.height =
                tamanho
                + "px";


            marker.style.background =
                statusColor(
                    status.state
                );


            marker.title =
                (
                    p.name
                    || "Estabelecimento"
                )
                + " — "
                + status.label;


            marker.onclick =
                function(ev) {

                    ev.stopPropagation();


                    selecionarSomenteProspect(
                        p
                    );

                };


            frag.appendChild(
                marker
            );

        }
    );


    /*
       ======================================================
       PRECISÃO GPS
       ======================================================
    */

    if (
        userLat !== null &&
        userLon !== null
    ) {

        const userPos =
            project(
                userLat,
                userLon,
                zoom
            );


        const ux =
            userPos.x
            - ox;


        const uy =
            userPos.y
            - oy;


        /*
           Círculo de precisão.
        */

        if (
            userAccuracy &&
            userAccuracy > 0
        ) {

            const metrosPorPixel =
                156543.03392
                *
                Math.cos(
                    userLat
                    *
                    Math.PI
                    / 180
                )
                /
                Math.pow(
                    2,
                    zoom
                );


            let raioPx =
                userAccuracy
                /
                metrosPorPixel;


            raioPx =
                Math.max(
                    8,
                    Math.min(
                        raioPx,
                        130
                    )
                );


            const accuracy =
                document
                .createElement(
                    "div"
                );


            accuracy.className =
                "user-accuracy";


            accuracy.style.left =
                ux + "px";


            accuracy.style.top =
                uy + "px";


            accuracy.style.width =
                raioPx * 2
                + "px";


            accuracy.style.height =
                raioPx * 2
                + "px";


            frag.appendChild(
                accuracy
            );

        }


        /*
           Bolinha azul.
        */

        const user =
            document
            .createElement(
                "div"
            );


        user.className =
            "user-location";


        user.style.left =
            ux + "px";


        user.style.top =
            uy + "px";


        user.title =
            "Sua localização";


        frag.appendChild(
            user
        );

    }


    /*
       troca todos os marcadores
    */

    marcasEl.innerHTML = "";


    marcasEl.appendChild(
        frag
    );

}


/* ==========================================================
   SUBSTITUI FUNÇÃO DE MAPA ORIGINAL
   ========================================================== */

desenharMapa =
    desenharMapaV2;


/* ==========================================================
   LIMPAR CACHE ANTIGO
   ========================================================== */

function limparCacheTilesV2() {

    try {

        for (
            const key in cacheTiles
        ) {

            const img =
                cacheTiles[key];


            if (
                img &&
                img.parentNode
            ) {

                img.parentNode
                    .removeChild(
                        img
                    );

            }

        }

    }

    catch(e) {}


    cacheTiles = {};


    if (tilesEl) {

        tilesEl.innerHTML = "";

    }

}


/* ==========================================================
   GPS
   ========================================================== */

function iniciarGPSV2() {

    if (
        !navigator.geolocation
    ) {

        console.warn(
            "GPS não disponível."
        );

        return;

    }


    navigator
        .geolocation
        .watchPosition(

            function(position) {

                userLat =
                    position
                    .coords
                    .latitude;


                userLon =
                    position
                    .coords
                    .longitude;


                userAccuracy =
                    position
                    .coords
                    .accuracy;


                const btn =
                    document
                    .getElementById(
                        "btnMinhaLocalizacao"
                    );


                if (btn) {

                    btn
                        .classList
                        .add(
                            "ativo"
                        );

                    btn.title =
                        "Minha localização — precisão aproximada: "
                        +
                        Math.round(
                            userAccuracy
                        )
                        +
                        " m";

                }


                /*
                   Não centraliza automaticamente.

                   Assim o mapa continua
                   mostrando os prospects.

                   A bolinha azul aparece
                   quando estiver dentro
                   da área visível.
                */

                desenharMapa();

            },


            function(error) {

                console.warn(
                    "Erro GPS:",
                    error.message
                );

            },


            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    3000,

                timeout:
                    20000

            }

        );

}


/* ==========================================================
   MINHA LOCALIZAÇÃO
   ========================================================== */

function centralizarMinhaLocalizacaoV2() {

    if (
        userLat === null ||
        userLon === null
    ) {

        alert(
            "Ainda não consegui acessar sua localização. Verifique se o GPS está habilitado e se a permissão de localização foi concedida."
        );

        return;

    }


    centralizar(
        userLat,
        userLon,
        17
    );

}


/* ==========================================================
   INICIALIZAÇÃO
   ========================================================== */

function iniciarAppV2() {

    /*
       limpa tiles antigos Google-first
    */

    limparCacheTilesV2();


    /*
       botão mostrar todos
    */

    const btnTodos =
        document.getElementById(
            "btnMostrarTodos"
        );


    if (btnTodos) {

        btnTodos.onclick =
            function(ev) {

                ev.preventDefault();

                ev.stopPropagation();

                mostrarTodosProspects();

            };

    }


    /*
       botão GPS
    */

    const btnGps =
        document.getElementById(
            "btnMinhaLocalizacao"
        );


    if (btnGps) {

        btnGps.onclick =
            function(ev) {

                ev.preventDefault();

                ev.stopPropagation();

                centralizarMinhaLocalizacaoV2();

            };

    }


    iniciarGPSV2();


    /*
       redesenha usando OSM
    */

    setTimeout(
        function() {

            aplicarFiltrosOriginalV2(
                true
            );

        },
        100
    );

}


/*
   DOM já pode estar pronto
   porque este script entra
   no fim do BODY.
*/

if (
    document.readyState
    === "loading"
) {

    document
        .addEventListener(
            "DOMContentLoaded",
            iniciarAppV2
        );

}

else {

    iniciarAppV2();

}

</script>
